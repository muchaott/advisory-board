<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    html, body { background: transparent !important; margin: 0; height: 100%; overflow: hidden; }
    .panel { display: flex; flex-direction: column; height: 100vh; background: var(--bg);
      border-radius: 16px; overflow: hidden; box-shadow: 0 12px 44px rgba(0,0,0,.55); border: 1px solid var(--line); }
    .p-head { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); cursor: grab; }
    .p-head:active { cursor: grabbing; }
    .p-av { width: 34px; height: 34px; border-radius: 50%; flex: none; }
    .p-name { font-weight: 650; font-size: 13.5px; }
    .p-sub { font-size: 11px; color: var(--txt-faint); }
    .p-btn { background: var(--bg-3); color: var(--txt-dim); border: 1px solid var(--line);
      width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; }
    .p-btn:hover { color: var(--txt); border-color: var(--accent); }
    .p-enlarge { margin-left: auto; }
    .p-close { margin-left: 6px; }
    .msg-img { display: block; max-width: 240px; max-height: 200px; border-radius: 9px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,.25); }
    .attach-bar { display: none; align-items: center; gap: 9px; padding: 8px 10px 0; }
    .attach-bar.show { display: flex; }
    .attach-thumb { width: 34px; height: 34px; object-fit: cover; border-radius: 7px; border: 1px solid var(--line); }
    .attach-name { font-size: 11.5px; color: var(--txt-dim); }
    .attach-x { margin-left: auto; background: var(--bg-3); color: var(--txt-dim); border: 1px solid var(--line); border-radius: 7px; width: 24px; height: 24px; cursor: pointer; }
    .drop { display: none; position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px;
      background: rgba(156,203,106,.08); align-items: center; justify-content: center; color: var(--accent); font-weight: 600; z-index: 5; }
    .panel.drag .drop { display: flex; }
    .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; -webkit-user-select: text; user-select: text; }
    .log::-webkit-scrollbar { width: 0; }
    .mb { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mb.you { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 7px 11px; border-radius: 12px 12px 4px 12px; max-width: 85%; }
    .mb.bot { align-self: flex-start; color: var(--txt); border-left: 3px solid #9ccb6a; padding-left: 10px; max-width: 96%; }
    .mb-name { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: #9ccb6a; margin-bottom: 3px; }
    .mb-doc { display: inline-block; margin-top: 5px; background: var(--bg-3); color: var(--txt-dim); border: 1px solid var(--line);
      border-radius: 6px; font-size: 10.5px; padding: 2px 7px; cursor: pointer; opacity: 0; transition: opacity .12s ease; }
    .mb.bot:hover .mb-doc { opacity: 1; }
    .mb-doc:hover { color: #9ccb6a; border-color: #9ccb6a; }
    .mb.note { align-self: center; font-size: 11px; color: var(--txt-faint); font-style: italic; padding: 1px 0; }
    .mb.bot.streaming::after { content: "▌"; color: var(--cur, #9ccb6a); animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    .composer textarea { flex: 1; resize: none; background: var(--bg-3); color: var(--txt); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px; font: inherit; max-height: 110px; overflow-y: auto; scrollbar-width: none; }
    .composer textarea::-webkit-scrollbar { width: 0; }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .send { flex: none; width: 38px; height: 38px; align-self: flex-end; display: flex; align-items: center;
      justify-content: center; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; cursor: pointer; font-size: 17px; }
    .send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <div class="p-head" id="head">
      <img class="p-av" src="/web/companion.svg" alt="" />
      <div><div class="p-name">Career Mentor</div><div class="p-sub">brings in the right specialist</div></div>
      <button class="p-btn p-enlarge" id="enlarge" title="Open full board">⤢</button>
      <button class="p-btn p-close" id="close" title="Close">✕</button>
    </div>
    <div class="log" id="log"></div>
    <div class="attach-bar" id="attachBar"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…  (drag an image in)"></textarea>
      <button type="submit" id="send" class="send">↑</button>
    </form>
    <div class="drop">Drop image to add context</div>
  </div>
  <script src="/web/chat.js"></script>
</body>
</html>
