<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion</title>
  <style>
    html, body { background: transparent !important; margin: 0; height: 100%; overflow: hidden;
      -webkit-user-select: none; user-select: none; }

    .avatar { position: fixed; top: 4px; left: 4px; width: 66px; height: 66px; border-radius: 50%;
      background: url("/web/companion.png") center/cover; cursor: grab; box-shadow: 0 3px 12px rgba(0,0,0,.4); }
    .avatar:active { cursor: grabbing; }

    /* chat action button, bottom-right of the avatar */
    .chatbtn { position: fixed; right: 2px; bottom: 2px; width: 28px; height: 28px; border-radius: 50%;
      background: #000; border: 2px solid #f1f4ee; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.55); }
    .chatbtn:hover { background: #1a1a1a; }
    .chatbtn:active { transform: scale(.92); }
    .chatbtn svg { width: 15px; height: 15px; fill: #fff; }

    /* unread dot — top-right of the avatar, plain red */
    .badge { position: fixed; top: 4px; right: 12px; width: 16px; height: 16px; border-radius: 50%;
      background: #ff3b30; color: #fff; font-size: 10px; font-weight: 700; display: none; align-items: center;
      justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    .badge.show { display: flex; }
  </style>
</head>
<body>
  <div class="avatar" id="avatar"></div>
  <div class="badge" id="badge">1</div>
  <div class="chatbtn" id="chatbtn" title="Chat">
    <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6a2 2 0 0 1 2-2z"/></svg>
  </div>
  <script src="/web/mini.js"></script>
</body>
</html>
