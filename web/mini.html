<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    html, body { background: transparent !important; margin: 0; height: 100%; overflow: hidden;
      -webkit-user-select: none; user-select: none; }

    /* avatar orb — fixed size + position so hover/menu never move it */
    .orb { position: fixed; top: 6px; right: 6px; width: 64px; height: 64px; border-radius: 50%;
      background: url("/web/companion.png") center/cover; cursor: grab; box-shadow: 0 3px 12px rgba(0,0,0,.35); }
    .orb:active { cursor: grabbing; }
    body.expanded .orb { display: none; }
    .badge { position: fixed; top: 2px; right: 2px; min-width: 20px; height: 20px; border-radius: 10px;
      background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700; display: none; align-items: center;
      justify-content: center; padding: 0 5px; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
    body.collapsed .badge.show { display: flex; }

    /* hover suggestions — appear to the LEFT of the orb, orb stays put */
    .suggest { position: fixed; top: 6px; left: 8px; right: 78px; bottom: 8px; display: flex; flex-direction: column; gap: 7px;
      overflow-y: auto; scrollbar-width: none; opacity: 0; transform: translateX(8px); pointer-events: none;
      transition: opacity .16s ease, transform .16s ease; }
    .suggest::-webkit-scrollbar { width: 0; }
    body.collapsed.hover .suggest { opacity: 1; transform: none; pointer-events: auto; }
    .sug-title { font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--txt-faint); padding-left: 2px; flex: none; }
    #chips { display: flex; flex-direction: column; gap: 8px; }
    .chip { background: rgba(20,24,43,.97); border: 1px solid var(--line); color: var(--txt); border-radius: 10px;
      padding: 9px 11px; font-size: 12px; line-height: 1.35; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45); text-align: left; }
    .chip:hover { border-color: var(--accent); background: var(--bg-3); }
    .chip:active { transform: scale(.985); }
    .chip.muted { color: var(--txt-faint); cursor: default; box-shadow: none; }

    /* right-click menu — below the orb */
    .ctx { position: fixed; top: 76px; right: 6px; background: var(--bg-2);
      border: 1px solid var(--line); border-radius: 9px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5);
      opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .14s ease, transform .14s ease; }
    body.collapsed.menu .ctx { opacity: 1; transform: none; pointer-events: auto; }
    .ctx div { padding: 8px 14px; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
    .ctx div:hover { background: var(--bg-3); }

    /* expanded panel */
    .panel { display: none; flex-direction: column; height: 100vh; background: var(--bg);
      border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
    body.expanded .panel { display: flex; }
    .p-head { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
    .p-av { width: 34px; height: 34px; border-radius: 50%; flex: none; }
    .p-name { font-weight: 650; font-size: 13.5px; }
    .p-sub { font-size: 11px; color: var(--txt-faint); }
    .p-collapse { margin-left: auto; background: var(--bg-3); color: var(--txt-dim); border: 1px solid var(--line);
      width: 26px; height: 26px; border-radius: 7px; cursor: pointer; font-size: 14px; }
    .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; -webkit-user-select: text; user-select: text; }
    .log::-webkit-scrollbar { width: 0; }
    .mb { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mb.you { align-self: flex-end; background: var(--accent); color: #fff; padding: 7px 11px; border-radius: 12px 12px 4px 12px; max-width: 85%; }
    .mb.bot { align-self: flex-start; color: var(--txt); border-left: 3px solid #2fc56b; padding-left: 10px; max-width: 96%; }
    .mb.bot.streaming::after { content: "▌"; color: #2fc56b; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .composer { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    .composer textarea { flex: 1; resize: none; background: var(--bg-3); color: var(--txt); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px; font: inherit; max-height: 110px; overflow-y: auto; scrollbar-width: none; }
    .composer textarea::-webkit-scrollbar { width: 0; }
    .composer textarea:focus { outline: none; border-color: var(--accent); }
    .send { flex: none; width: 38px; height: 38px; align-self: flex-end; display: flex; align-items: center;
      justify-content: center; background: var(--accent); color: #fff; border: 0; border-radius: 10px; cursor: pointer; font-size: 17px; }
    .send:disabled { opacity: .5; }
  </style>
</head>
<body class="collapsed">
  <div class="orb" id="orb"><div class="badge" id="badge">1</div></div>

  <div class="suggest" id="suggest">
    <div class="sug-title">Recommended now</div>
    <div id="chips"></div>
  </div>

  <div class="ctx" id="ctx">
    <div data-act="board">Open full board</div>
    <div data-act="hide">Hide avatar</div>
  </div>

  <div class="panel">
    <div class="p-head">
      <img class="p-av" src="/web/companion.png" alt="" />
      <div><div class="p-name">Advisory Board</div><div class="p-sub">your companion</div></div>
      <button class="p-collapse" id="collapse" title="Minimize">–</button>
    </div>
    <div class="log" id="log"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
      <button type="submit" id="send" class="send">↑</button>
    </form>
  </div>

  <script src="/web/mini.js"></script>
</body>
</html>
