<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion</title>
  <link rel="stylesheet" href="/web/styles.css" />
  <style>
    body { background: var(--bg); }
    .mini { display: flex; flex-direction: column; height: 100vh; }
    .mini-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .mini-av { width: 38px; height: 38px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
    .mini-name { font-weight: 650; font-size: 14px; }
    .mini-sub { font-size: 11px; color: var(--txt-faint); }
    .mini-log { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
    .mini-log::-webkit-scrollbar { width: 0; }
    .mb { font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .mb.you { align-self: flex-end; background: var(--accent); color: #fff; padding: 7px 11px; border-radius: 12px 12px 4px 12px; max-width: 85%; }
    .mb.bot { align-self: flex-start; color: var(--txt); border-left: 3px solid #2fc56b; padding-left: 10px; max-width: 96%; }
    .mb.bot.streaming::after { content: "▌"; color: #2fc56b; animation: blink 1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .mini-composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
    .mini-composer textarea { flex: 1; resize: none; background: var(--bg-3); color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; max-height: 120px; overflow-y: auto; scrollbar-width: none; }
    .mini-composer textarea::-webkit-scrollbar { width: 0; }
    .mini-composer textarea:focus { outline: none; border-color: var(--accent); }
    .mini-send { flex: none; width: 38px; height: 38px; align-self: flex-end; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; border: 0; border-radius: 10px; cursor: pointer; font-size: 17px; }
    .mini-send:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="mini">
    <div class="mini-head">
      <img class="mini-av" src="/web/companion.png" alt="" />
      <div><div class="mini-name">Advisory Board</div><div class="mini-sub" id="sub">your companion</div></div>
    </div>
    <div class="mini-log" id="log"></div>
    <form class="mini-composer" id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
      <button type="submit" id="send" class="mini-send">↑</button>
    </form>
  </div>
  <script src="/web/mini.js"></script>
</body>
</html>
